server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        # Forwarded-* headers so the API can tell it's being reached over HTTPS even though this
        # proxy hop to it is plain HTTP - without these, OIDC/OAuth2 callback redirect_uris get
        # built as http:// instead of https:// (see Program.cs's UseForwardedHeaders). Passes
        # through whatever an outer TLS-terminating proxy/tunnel already set, if any.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://api:8080;
    }
}
