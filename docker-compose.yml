services:
  api:
    build:
      context: ./backend/MarkdownHub.Api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Local username/password always works out of the box - these two just bootstrap the
      # initial administrator account on the very first boot (see README). ADMIN_PASSWORD_FILE
      # (a Docker secret path) takes precedence over ADMIN_PASSWORD if both are set. Changing
      # either after the account already exists has no effect - the database is authoritative
      # from then on, manage the password from the admin page instead.
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:-}
      Admin__PasswordFile: ${ADMIN_PASSWORD_FILE:-}
      # Optional - seeds one external OIDC provider on a brand-new database only. After that,
      # providers are entirely managed via the admin page and these env vars are no longer read.
      OidcDefault__Name: ${OIDC_DEFAULT_NAME:-Default}
      OidcDefault__Authority: ${OIDC_DEFAULT_AUTHORITY:-}
      OidcDefault__ClientId: ${OIDC_DEFAULT_CLIENT_ID:-}
      OidcDefault__ClientSecret: ${OIDC_DEFAULT_CLIENT_SECRET:-}
      OidcDefault__Audience: ${OIDC_DEFAULT_AUDIENCE:-}
      OidcDefault__RequireHttpsMetadata: ${OIDC_DEFAULT_REQUIRE_HTTPS_METADATA:-true}
      # Optional - fixes the origin used to build OIDC/OAuth2 callback redirect URIs. Only needed
      # if the API sits behind a reverse proxy that doesn't forward the original scheme/host.
      Auth__PublicApiOrigin: ${AUTH_PUBLIC_API_ORIGIN:-}
      # Optional - overrides the auto-generated (and DB-persisted) JWT signing key. Only needed
      # for a multi-instance deployment where every instance must share the same key.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Sessions__LifetimeHours: ${SESSION_LIFETIME_HOURS:-168}
      Hub__MarkdownRoot: /data/markdown
      Hub__BackupLocation: /data/backups
      Ai__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      Ai__Ollama__Model: ${OLLAMA_MODEL:-gpt-oss:20b}
      ConnectionStrings__Default: "Data Source=/data/db/markdown-hub.db"
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:${FRONTEND_PORT:-8086}
      Cors__AllowedOrigins__2: ${FRONTEND_ORIGIN:-}
    volumes:
      - ${HUB_HOST_PATH:-./data/markdown}:/data/markdown
      - backup-data:/data/backups
      - db-data:/data/db
      # Data Protection key ring, used to encrypt provider client secrets at rest - must persist
      # across restarts/redeploys, or every previously-stored secret becomes undecryptable.
      - keys-data:/data/keys
    ports:
      - "${API_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8086}:80"
    depends_on:
      - api

volumes:
  backup-data:
  db-data:
  keys-data:

# Need something host-specific this file shouldn't hardcode for everyone (e.g. an extra_hosts
# entry to work around a NAT hairpin issue reaching your own domain from inside the container)?
# Add a docker-compose.override.yml next to this file - Compose merges it automatically, and
# it's gitignored so it stays local to this machine.
